name: release

# Builds release binaries for Linux, Windows, macOS and FreeBSD and attaches
# them to a GitHub Release. Triggered by pushing a tag like `v2.1.4`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run tests
        run: cargo test --release --locked
      - name: Build .deb package
        run: scripts/build-deb.sh
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/mctx dist/mctx-linux-x86_64
          cp target/release/mctx-gui dist/mctx-gui-linux-x86_64
          cp target/mctx_2.1.4_amd64.deb dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/mctx.exe dist/mctx-windows-x86_64.exe
          cp target/release/mctx-gui.exe dist/mctx-gui-windows-x86_64.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist

  macos-x86:
    name: macOS x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/mctx dist/mctx-macos-x86_64
          cp target/x86_64-apple-darwin/release/mctx-gui dist/mctx-gui-macos-x86_64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86
          path: dist

  macos-arm:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/mctx dist/mctx-macos-arm64
          cp target/release/mctx-gui dist/mctx-gui-macos-arm64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: dist

  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust
          run: cargo build --release --locked -p mctx-notepad
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/mctx dist/mctx-freebsd-amd64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebsd
          path: dist

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/mctx-android.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos-x86, macos-arm, freebsd, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List staged assets
        run: ls -la artifacts
      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          name: mctx ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
