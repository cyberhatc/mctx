name: android-apk

# Builds the Android APK on demand (and on android/ changes) and uploads it
# as a workflow artifact so it can be downloaded and side-loaded directly.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mctx-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
